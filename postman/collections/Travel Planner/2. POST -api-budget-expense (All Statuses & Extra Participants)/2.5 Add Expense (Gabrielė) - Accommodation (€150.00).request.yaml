$kind: http-request
url: "{{baseUrl}}/api/budget/expense"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "tripCode": "{{inviteCode}}",
      "participantId": "{{participantGabrieleId}}",
      "category": "Accommodation",
      "amount": 150.00
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 5000
