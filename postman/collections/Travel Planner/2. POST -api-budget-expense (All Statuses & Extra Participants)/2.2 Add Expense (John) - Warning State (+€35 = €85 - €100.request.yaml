$kind: http-request
name: 2.2 Add Expense (John) - Warning State (+€35 = €85 / €100 Food)
url: "{{baseUrl}}/api/budget/expense"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "tripCode": "{{inviteCode}}",
      "participantId": "{{organizerId}}",
      "category": "Food",
      "amount": 35.00
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 2000
