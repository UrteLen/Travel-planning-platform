$kind: http-request
url: "{{baseUrl}}/api/budget/settlement?tripCode={{inviteCode}}"
method: GET
queryParams:
  tripCode: "{{inviteCode}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Returns list of settlements', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.be.an('array');
      });
    language: text/javascript
order: 1000
