$kind: http-request
url: "{{baseUrl}}/api/Trip/join"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "inviteCode": "ZZZZZZ",
      "participantName": "X"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 404", () => pm.response.to.have.status(404));
    language: text/javascript
order: 1000
