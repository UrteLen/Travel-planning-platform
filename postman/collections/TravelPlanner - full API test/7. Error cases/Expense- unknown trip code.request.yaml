$kind: http-request
name: "Expense: unknown trip code"
url: "{{baseUrl}}/api/Budget/expense"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tripCode": "ZZZZZZ",
      "participantId": "{{organizerId}}",
      "amount": 5,
      "category": "Food"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 3000
