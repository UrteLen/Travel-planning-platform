$kind: http-request
name: "Activity: invalid category"
url: "{{baseUrl}}/api/Activity/{{tripId}}"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "X",
      "category": "Banana",
      "latitude": 54.7,
      "longitude": 25.3,
      "durationHours": 1
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 9000
