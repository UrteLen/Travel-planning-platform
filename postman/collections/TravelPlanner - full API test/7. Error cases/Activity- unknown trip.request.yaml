$kind: http-request
name: "Activity: unknown trip"
url: "{{baseUrl}}/api/Activity/11111111-1111-1111-1111-111111111111"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "X",
      "category": "Food",
      "latitude": 54.7,
      "longitude": 25.3,
      "durationHours": 1
