$kind: http-request
url: "{{baseUrl}}/api/Trip/create"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Vilnius Weekend",
      "destination": "Vilnius",
      "startDate": "2026-10-11T00:00:00Z",
      "endDate": "2026-10-13T00:00:00Z",
      "organizerName": "Organizer"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      const t = pm.response.json();
      const ids = Object.keys(t.participants);
      pm.test("Trip has an id and a 6-character invite code", () => {
        pm.expect(t.id).to.be.a("string");
        pm.expect(t.inviteCode).to.have.lengthOf(6);
      });
      pm.test("Organizer is the only participant", () => {
        pm.expect(ids).to.have.lengthOf(1);
        pm.expect(["Organizer", 0]).to.include(t.participants[ids[0]].role);
      });
      pm.collectionVariables.set("tripId", t.id);
      pm.collectionVariables.set("tripCode", t.inviteCode);
      pm.collectionVariables.set("organizerId", ids[0]);
    language: text/javascript
order: 1000
