$kind: http-request
name: "Add activity: Gediminas Tower"
url: "{{baseUrl}}/api/Activity/{{tripId}}"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Gediminas Tower",
      "category": "Activities",
      "latitude": 54.6869,
      "longitude": 25.2909,
      "durationHours": 1,
      "estimatedCost": 10,
      "optional": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      const a = pm.response.json();
      pm.test("Activity name is Gediminas Tower", () => pm.expect(a.name).to.eql("Gediminas Tower"));
      pm.test("No opening hours (API cannot set them yet)", () => {
        pm.expect(a.openingTime).to.eql(null);
        pm.expect(a.closingTime).to.eql(null);
      });
      pm.collectionVariables.set("act1", a.id);
    language: text/javascript
order: 1000
