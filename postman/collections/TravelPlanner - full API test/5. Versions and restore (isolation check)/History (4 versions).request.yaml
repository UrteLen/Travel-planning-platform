$kind: http-request
url: "{{baseUrl}}/api/Plan/{{tripId}}/history"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      const h = pm.response.json();
      pm.test("Four versions in history", () => pm.expect(h).to.have.lengthOf(4));
      pm.test("Version numbers are 1..4", () => pm.expect(h.map(v => v.versionNumber)).to.eql([1, 2, 3, 4]));
      pm.test("Only v3 and v4 are restores, both from v1", () => {
        pm.expect(h[0].restoredFromVersion).to.eql(null);
        pm.expect(h[1].restoredFromVersion).to.eql(null);
        pm.expect(h[2].restoredFromVersion).to.eql(1);
        pm.expect(h[3].restoredFromVersion).to.eql(1);
      });
    language: text/javascript
order: 10000
