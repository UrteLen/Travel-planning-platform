$kind: http-request
name: "Summary: 350 / 2 = 175"
url: "{{baseUrl}}/api/Budget/summary?tripCode={{tripCode}}"
method: GET
queryParams:
  tripCode: "{{tripCode}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      const s = pm.response.json();
      pm.test("Cost per person is 175", () => pm.expect(s.costPerPerson).to.eql(175));
    language: text/javascript
order: 7000
