$kind: http-request
name: "Summary: 355 / 2 = 177.5"
url: "{{baseUrl}}/api/Budget/summary?tripCode={{tripCode}}"
method: GET
queryParams:
  tripCode: "{{tripCode}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      const s = pm.response.json();
      pm.test("Cost per person is 177.5", () => pm.expect(s.costPerPerson).to.eql(177.5));
    language: text/javascript
order: 2000
