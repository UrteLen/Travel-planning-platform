$kind: http-request
url: "{{baseUrl}}/api/Budget/expense"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tripCode": "{{tripCode}}",
      "participantId": "{{organizerId}}",
      "amount": 10,
      "category": "Food"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Message says expense added", () => pm.expect(pm.response.json().message).to.eql("Expense added"));
    language: text/javascript
order: 1000
