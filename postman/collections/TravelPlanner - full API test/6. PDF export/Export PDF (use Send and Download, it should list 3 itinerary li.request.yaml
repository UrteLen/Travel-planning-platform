$kind: http-request
name: Export PDF (use Send and Download, it should list 3 itinerary lines)
url: "{{baseUrl}}/api/Budget/export/{{tripId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Content-Type is application/pdf", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("application/pdf"));
      pm.test("File name starts with trip-summary", () => pm.expect(pm.response.headers.get("Content-Disposition")).to.include("trip-summary"));
      pm.test("PDF is not empty", () => pm.expect(pm.response.responseSize).to.be.above(1000));
      pm.test("File starts with %PDF", () => {
        let head = "";
        try { head = String.fromCharCode(...Array.from(pm.response.stream).slice(0, 4)); }
        catch (e) { head = pm.response.text().slice(0, 4); }
        pm.expect(head).to.eql("%PDF");
      });
    language: text/javascript
order: 1000
