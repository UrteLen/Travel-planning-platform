$kind: http-request
url: "{{baseUrl}}/api/Plan/{{tripId}}/history"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      const h = pm.response.json();
      pm.test("One version saved", () => pm.expect(h).to.have.lengthOf(1));
      pm.test("Version 1 is a normal save", () => {
        pm.expect(h[0].versionNumber).to.eql(1);
        pm.expect(h[0].changedBy).to.eql("Organizer");
        pm.expect(h[0].restoredFromVersion).to.eql(null);
      });
    language: text/javascript
order: 3000
