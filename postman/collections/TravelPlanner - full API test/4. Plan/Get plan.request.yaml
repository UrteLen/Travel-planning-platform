$kind: http-request
url: "{{baseUrl}}/api/Plan/{{tripId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Stored plan has 3 visits", () => pm.expect(pm.response.json()).to.have.lengthOf(3));
    language: text/javascript
order: 2000
